//Italian translation by JustAddDuctTape 

Localization
{
	it-it
	{
		#loc_APP_modname = AirplanePlus

		#loc_APP_agent_title = Kerbal Standard
		#loc_APP_agent_description = Kerbal Standard è un Conglomerato in continua crescita. Vanta molti prodotti che hanno ricevuto il loro nome dalle iniziali di certe compagnie sussidiarie come RR, DB e WMB. I prodotti costruiti dalla Compagnia Madre di Kerbal Standard non hanno nomi particolari. Kerbal Standard ha rapporti conosciuti con Winter Owl e Divisione Aerospaziale C7 ed ha comprato alcuni diritti sul design delle parti per poter lavorare con loro. La maggior parte dei progetti del Conglomerato è pensata per avere un ottimo design e per vendere con grandi benefici commerciali.

		#loc_APP_part_manufacturer = Kerbal Standard
		#loc_APP_part_description = Una Parte da AirplanePlus.

		// Part : 109Prop
		#loc_APP_part_109Prop_title = Motore KB 601 "Tornado"
		#loc_APP_part_109Prop_description = Un motore V12 con dentro una grande ventola, ma aspetta! Questo è un motore V12 invertito e raffreddato a liquido. Fai caso agli scarichi, adesso sono sulla parte sotto. Cose del genere tendono a succedere durante le pause nel laboratorio, grandi svolte come girare un motore a testa in giù.

		// Part : 144cockpit
		#loc_APP_part_144cockpit_title = Abitacolo Non Commerciale Mk2/Oggetto 1.44
		#loc_APP_part_144cockpit_description = Questo lungo abitacolo Mk2 ha spazio per non due, ma ben un Kerbal! Aspetta, cosa? Non so quanto sia una cosa buona. Ma dovrebbe essere più leggero, giusto?

		// Part : 152Prop
		#loc_APP_part_152Prop_title = Motore Turboelica L K-235 "Gatto" 
		#loc_APP_part_152Prop_description = Il K-235 Rotamax è la turboelica del Kerbal al verde. Chiunque dica che c'è un solo motore nella turboclasse da 0.625 chiaramente non comprende l'utilità di questo motore economico ed affidabile.
		// Part : 51prop
		#loc_APP_part_51prop_title = Motore WMB VI "Vortice"
		#loc_APP_part_51prop_description = Non è esattamente la versione preliminare del KB 601 "Tornado", ma questo design precedente ha delle somiglianze notevoli con esso. Il motore WMB VI vanta la sua configurazione a V tanto che la sua cappottatura ha la forma del motore stesso.

		// Part : 609prop
		#loc_APP_part_609prop_title = Motore Turboalbero KT6C "Multiplo"
		#loc_APP_part_609prop_description = Una versione tardiva del KT6A "Micio" modificata per ottenere capacità di volo sia verticali che orizzontali. E' equipaggiato con dei servomotori speciali che consentono la transizione da una posizione all'altra, includendo posizioni intermedie.

		// Part : JuniorFuselage
		#loc_APP_part_JuniorFuselage_title = Fusoliera per Carburante Liquido MK1 Junior
		#loc_APP_part_JuniorFuselage_description = Niente soldi? Nessun problema!

		// Part : KP12
		#loc_APP_part_KP12_title = Motore Kontrorotante KP-12 "Orso" 
		#loc_APP_part_KP12_description = Due eliche su un motore? Beh, aggiungendo eliche non si sbaglia mai!

		// Part : Mk1JuniorStructural
		#loc_APP_part_Mk1JuniorStructural_title = Fusoliera Strutturale Junior
		#loc_APP_part_Mk1JuniorStructural_description = Una fusoliera standard in formato ridotto. Non contiene carburante: ha funzione puramente strutturale. Grazie a ciò e vari rinforzi è più leggera e resistente.
		// Part : Mk1SlantStructural
		#loc_APP_part_Mk1SlantStructural_title = Spaziatore Angolato per Fusoliere Strutturali
		#loc_APP_part_Mk1SlantStructural_description = Una fusoliera strutturale angolata. Utile per modificare la natura lineare dei veicoli e per costruire forme strane.

		// Part : S1APU
		#loc_APP_part_S1APU_title = Unità di Potenza Ausiliaria di Taglia 1 100-KE 
		#loc_APP_part_S1APU_description = Molti motori difettosi, non in grado di produrre abbastanza spinta, stanno venendo riciclati da Kerbal Standard principalmente per ragioni ecologiche e non per via del loro costo. Sono comunque in grado di generare elettricità, e la spinta quasi nulla comporta un consumo di carburante ridotto.

		// Part : S1p5APU
		#loc_APP_part_S1p5APU_title = Unità di Potenza Ausiliaria di Taglia 1.5 220-KE
		#loc_APP_part_S1p5APU_description = L'UPA 220-KE è la sorella maggiore della 100-KE. Nelle unità di produzione Kerbal Standard, i Kerbal tirocinanti vengono messi in prima linea per imparare il mestiere e non per scarsità di forza lavoro. Ciò risulta in frequenti errori di scala nei progetti; i risultati vengono solitamente adattati alla classe più vicina, che è la Taglia 1.5. Finora ha funzionato. Nessun rimborso.

		// Part : S2APU
		#loc_APP_part_S2APU_title = Unità di Potenza Ausiliaria di Taglia 2 131-9K 
		#loc_APP_part_S2APU_description = La 131-9K è molto diversa dalle altre UPA. E' stata infatti appositamente progettata e non è stata ricavata da motori difettosi. Questa UPA è stata pensata sin dall'inizio come un generatore ed è stata costruita per esserlo. In teoria. Le parti utilizzate provengono comunque da fallimenti minori riutilizzabili come pezzi più grandi, ottenendo come risultato il progetto 131. La 131-9K è una delle UPA più efficienti mai costruite, principalmente perchè è stata ideata per esserlo.

		// Part : S2Hull
		#loc_APP_part_S2Hull_title = Stiva Strutturale S2
		#loc_APP_part_S2Hull_description = Una stiva standard di Taglia 2. Utile per trasportare carichi. Non contiene carburante: ha funzione puramente strutturale. Grazie a ciò e vari rinforzi è più leggera e resistente.

		// Part : S2Structural
		#loc_APP_part_S2Structural_title = Fusoliera Strutturale S2
		#loc_APP_part_S2Structural_description = Una fusoliera standard di Taglia 2. Non contiene carburante: ha funzione puramente strutturale. Grazie a ciò e vari rinforzi è più leggera e resistente.

		// Part : airbuscockpit
		#loc_APP_part_airbuscockpit_title = Abitacolo Commerciale di Taglia 2
		#loc_APP_part_airbuscockpit_description = Porta due Kerbal e sembra particolarmente ingombrante. Ha un ottimo sistema di controllo, a parte sul rollio. Ci si è sempre chiesti perchè la Taglia Mk2 non avesse forma cilindrica con diametro da 2.5 metri; Kerbal Standard ha realizzato il pezzo mancante, l'abitacolo di Taglia 2. E' pure in sconto!

		// Part : airbusreargear
		#loc_APP_part_airbusreargear_title = Carrello d'Atterraggio KS-320 
		#loc_APP_part_airbusreargear_description = C'è molta scelta se ti serve un carrello d'atterraggio, ma è abbastanza assurdo che non esista un carrello che specchi la sospensione a destra e a sinistra rispettivamente. Certo, potrebbe essere per via della difficoltà di produrre le parti in modo esattamente simmetrico, ma questi sono dettagli. Non ci importano.

		// Part : airramp
		#loc_APP_part_airramp_title = Portello Passeggeri Taglia 2
		#loc_APP_part_airramp_description = Progettato per dare una via d'uscita ai Kerbal intrappolati nelle Fusoliere cave di Taglia 2.

		// Part : b29cockpit
		#loc_APP_part_b29cockpit_title = Abitacolo con Vista II di Taglia 2
		#loc_APP_part_b29cockpit_description = Un abitacolo con più spazio per i Kerbal di quanto si possa immaginare. Ci stanno fino a 4 Kerbal e non c'è abitacolo con una vista migliore. Vanta un parabrezza quasi interamente in vetro che porta a chiedersi perchè non sia stato effettivamente costruito esclusivamente in vetro, anche se è già abbastanza sotto sforzo così com'è da potersi smontare da un momento all'altro. Questo non è qualcosa di cui preoccuparsi in volo.

		// Part : b29gear
		#loc_APP_part_b29gear_title = Carrello d'Atterraggio Enorme KS-FAT-29
		#loc_APP_part_b29gear_description = Per compensare le dimensioni di certi Kerbal c'è nientemeno che il Carrello d'Atterraggio Enorme KS-FAT-29. Solamente la ruota è grande come un Kerbal, ed è accompagnata da grandi supporti per motivi di sicurezza. Non importa quanto possa aumentare il volume, il materiale probabilmente reggerà. In fin dei conti grande è sempre meglio.

		// Part : bellcockpit
		#loc_APP_part_bellcockpit_title = Abitacolo con Vista Mk1
		#loc_APP_part_bellcockpit_description = Il problema dei Kerbal del giorno d'oggi è l'ossessione per la velocità. Prenditi qualche minuto per ammirare la vista da questo abitacolo con vista e classe impareggiabili.

		// Part : bellprop
		#loc_APP_part_bellprop_title = Motore Turboalbero RR K250 "Temerario" 
		#loc_APP_part_bellprop_description = La prima scelta quando si vuole atterrare e decollare assolutamente ovunque su Kerbin.

		// Part : belltail
		#loc_APP_part_belltail_title = Rotore di Controllo RR K250-S 
		#loc_APP_part_belltail_description = Un piccolo rotore il cui albero viene solitamente collegato ad un motore principale. Usato per evitare una rotazione incontrollabile o per causarla.

		// Part : bigwing
		#loc_APP_part_bigwing_title = Ala Principale per Aeroplani FAT-T3R
		#loc_APP_part_bigwing_description = Una delle superfici portanti più grandi in produzione. Il suo volume interno è abbastanza grande da poter contenere serbatoi di carburante dalle dimensioni generose.

		// Part : biplanegear
		#loc_APP_part_biplanegear_title = Carrello d'Atterraggio Fisso KS-H1 
		#loc_APP_part_biplanegear_description = Avere solo una sbarra a cui fissare la ruota riduce la praticità del carrello (LY-01); un'ingegnosa svolta è arrivata con l'aggiunta di un'altra sbarra per formare una V che converge verso la ruota.

		// Part : blackhawkgear
		#loc_APP_part_blackhawkgear_title = Carrello d'Atterraggio Fisso KS-V1
		#loc_APP_part_blackhawkgear_description = Il KS-V1 è un carrello di base un po' più sofisticato di una ruota in cima ad una sbarra. E' più pesante ed ha la stessa funzionalità, ma qualche volta un leggero aumento del peso è meglio di un'alternativa esteticamente peggiore.

		// Part : blackhawkprop
		#loc_APP_part_blackhawkprop_title = Motore Turboalbero K700 "Aquila"
		#loc_APP_part_blackhawkprop_description = Se stai cercando qualcosa di né troppo debole né troppo potente da usare per il trasporto, il K700 "Aquila" è ciò che fa per te. Ha quattro pale, non troppe ma neanche troppo poche, ed è (abbastanza) affidabile.

		// Part : bombardiercockpit
		#loc_APP_part_bombardiercockpit_title = Abitacolo di Taglia 1.5
		#loc_APP_part_bombardiercockpit_description = Quando gli Abitacoli Mk1 sono troppo piccoli e gli Abitacoli di Taglia 2 sono troppo grandi, la scelta è dicotomica ma porta a compromessi. Perchè non pensare fuori dagli schemi? Dove c'è domanda, ci sarà offerta. D'altronde, il modo migliore per pilotare un veicolo di Taglia 1.5 è con il rispettivo abitacolo.

		// Part : cessnacabin
		#loc_APP_part_cessnacabin_title = Cabina per Equipaggio MK3S1 
		#loc_APP_part_cessnacabin_description = Una cabina per passeggeri meno confortevole con due sedili affiancati e giusto abbastanza spazio per potersi infilare (a malapena) in un'altra cabina. Anche se non è costruita con i materiali più leggeri per via delle grandi finestre, è garantito che è comunque probabilmente sicura e, alla fine, comunque non troppo pesante. Costa pure poco.

		// Part : cessnacockpit
		#loc_APP_part_cessnacockpit_title = Abitacolo MK3S1
		#loc_APP_part_cessnacockpit_description = L'Abitacolo MK3S1 è uno dei design da due posti più abbordabili nel catalogo. Il suo design semplice, leggero e dalle dimensioni ridotte è pensato per rendere possibile in sicurezza il volo con abitacolo chiuso.

		// Part : cf34
		#loc_APP_part_cf34_title = Motore Turboventola ad Alto Rapporto di Diluizione J-34 "Gallone"
		#loc_APP_part_cf34_description = Il J-34 "Gallone" è il cugino minore del J-56 "Loto" con meno pale ma con la stessa elevata efficienza. La taglia non è molto diversa, ma il J-34 utilizza esclusivamente il montaggio radiale.

		// Part : cfm56
		#loc_APP_part_cfm56_title = Motore Turboventola ad Alto Rapporto di Diluizione J-56 "Loto"
		#loc_APP_part_cfm56_description = Questo motore funziona al suo meglio con velocità ed altitudini ridotte. Ha in tutto 38 pale per motore. Conta le pale prima dell'acquisto, garanzia nulla se sono presenti più o meno di 38 pale.

		// Part : chaikaprop
		#loc_APP_part_chaikaprop_title = Motore Radiale K-25V "Ciclone" 
		#loc_APP_part_chaikaprop_description = Un potente motore radiale con una forma corta e allargata, utilizzabile per i più svariati impieghi.

		// Part : chinookprop
		#loc_APP_part_chinookprop_title = Motore Turboalbero L K55 "Gemelli"
		#loc_APP_part_chinookprop_description = Nuove tecniche ingegneristiche innovative hanno portato all'L K55 "Gemelli". Prendere tre ali e metterle su una piattaforma rotante è parso funzionare. Certo, sono solo tre, ma abbastanza grandi e larghe per sollevare anche carichi pesanti.

		// Part : citationcockpit
		#loc_APP_part_citationcockpit_title = Abitacolo Business Mk1
		#loc_APP_part_citationcockpit_description = Goditi il lusso di stare in un abitacolo minuscolo taglia Mk1. L'Abitacolo Mk1 regolare ha spazio per un solo Kerbal, mentre questo ne ha per due. Questo può portare a chiedersi se la cabina possa essere definita Business e non semplicemente Commerciale.

		// Part : coaxialprop
		#loc_APP_part_coaxialprop_title = Motore Turboalbero Coassiale KV3-117 "Doppio Taglio"
		#loc_APP_part_coaxialprop_description = Il Motore Turboalbero Coassiale è il risultato di ricerche per l'ottimizzazione della potenza in motori dalle dimensioni ridotte. Non è solo poco ingombrante, ha anche capacità di controllo migliori rispetto al tipico rotore che garantiscono maggiore stabilità.

		// Part : concordecockpit
		#loc_APP_part_concordecockpit_title = Abitacolo con Muso ad Assetto Variabile di Taglia 2
		#loc_APP_part_concordecockpit_description = Questo abitacolo specializzato ha spazio per 3 Kerbal, giusto in caso tu ne perda qualcuno. E' inoltre abbastanza pesante a causa dello speciale meccanismo al suo interno. Data la forma ottimizzata al volo supersonico, l'abitacolo ha un muso particolarmente lungo ed appuntito che rende difficile vedere la pista. E quale modo migliore per migliorare la visibilità che poter inclinare il muso?

		// Part : corsairprop
		#loc_APP_part_corsairprop_title = Motore Radiale K-2800 "Calabrone"
		#loc_APP_part_corsairprop_description = Questo ottimo motore ha ben due file di pistoni radiali! Altro che "più potenza"!

		// Part : doublefowlerflap
		#loc_APP_part_doublefowlerflap_title = Flap a Doppia Scanalatura
		#loc_APP_part_doublefowlerflap_description = Non c'è flap migliore di un flap a doppia scanalatura (a parte un flap con più scanalature). I flap a doppia scanalatura sono comunque già enormi. Questo flap è solitamente posizionato nella parte posteriore dell'ala. Non è nulla di obbligatorio, sono solo le istruzioni sul manuale. Può essere utilizzato per controllare il beccheggio, durante il decollo oppure in fase di atterraggio se in completa estensione. E' utile anche per controllare con precisione la velocità di crociera. Questo flap è così versatile grazie al doppio set di superfici di controllo che consentono l'estensione indipendente.

		// Part : duplexcyclone
		#loc_APP_part_duplexcyclone_title = Motore Radiale K-3350 "Tempesta"
		#loc_APP_part_duplexcyclone_description = Ci sono più modi per risolvere problemi come "due file di motori radiali non bastano". Tra questi: allungare le pale, aggiungerne altre e magari anche infilare qualche cilindro in più. Tutti questi provvedimenti sono stati presi con il "Tempesta". Ottimo per spremere un po' di potenza in più fuori da un motore già moderatamente performante.

		// Part : elevon2b
		#loc_APP_part_elevon2b_title = Elevone 2B
		#loc_APP_part_elevon2b_description = Queste superfici di controllo sono realizzate con i materiali più pregiati e il loro funzionamento è garantito, a patto che restino attaccate all'apparecchio. Tuttavia, alcuni studi hanno mostrato che la mancanza di atmosfera *potrebbe* interferire leggermente con le loro prestazioni. Nessun rimborso.

		// Part : f5jet
		#loc_APP_part_f5jet_title = Turboventola Postbruciante J-85 "Tigre"
		#loc_APP_part_f5jet_description = Un motore 0.625 ad alte performance con ugello fisso e un postbruciatore per un po' di spinta extra.

		// Part : falconcockpit
		#loc_APP_part_falconcockpit_title = Abitacolo Non Commerciale Mk2
		#loc_APP_part_falconcockpit_description = Questo abitacolo Mk2 ha spazio per non due, ma ben un Kerbal! Aspetta, cosa? Non so quanto sia una cosa buona. Ma dovrebbe essere più leggero, giusto?

		// Part : fatwing0
		#loc_APP_part_fatwing0_title = Connettore Alare FAT-A
		#loc_APP_part_fatwing0_description = Ritagli da Ali Principali per Aeroplani FAT per forme più precise e con meno integrità strutturale.

		// Part : fatwing1
		#loc_APP_part_fatwing1_title = Connettore Alare FAT-B
		#loc_APP_part_fatwing1_description = Ritagli da Ali Principali per Aeroplani FAT per forme più precise e con meno integrità strutturale.

		// Part : fatwing2
		#loc_APP_part_fatwing2_title = Connettore Alare FAT-C
		#loc_APP_part_fatwing2_description = Ritagli da Ali Principali per Aeroplani FAT per forme più precise e con meno integrità strutturale.

		// Part : fatwing3
		#loc_APP_part_fatwing3_title = Connettore Alare FAT-D
		#loc_APP_part_fatwing3_description = Ritagli da Ali Principali per Aeroplani FAT per forme più precise e con meno integrità strutturale.

		// Part : fatwing4
		#loc_APP_part_fatwing4_title = Connettore Alare FAT-E
		#loc_APP_part_fatwing4_description = Ritagli da Ali Principali per Aeroplani FAT per forme più precise e con meno integrità strutturale.

		// Part : fatwing5
		#loc_APP_part_fatwing5_title = Connettore Alare FAT-F
		#loc_APP_part_fatwing5_description = Ritagli da Ali Principali per Aeroplani FAT per forme più precise e con meno integrità strutturale.

		// Part : fatwing6
		#loc_APP_part_fatwing6_title = Connettore Alare FAT-G
		#loc_APP_part_fatwing6_description = Ritagli da Ali Principali per Aeroplani FAT per forme più precise e con meno integrità strutturale.

		// Part : fighterProp
		#loc_APP_part_fighterProp_title = Motore K1710 "Mulinello"
		#loc_APP_part_fighterProp_description = E' un motore V12 con una grande ventola al suo interno. In teoria può sollevare un aeroplano, se usato in modo intelligente. I suoi superturbocompressori aumentano il peso e l'efficienza ad alta quota.

		// Part : fightercockpit
		#loc_APP_part_fightercockpit_title = Abitacolo Non Commerciale Mk1
		#loc_APP_part_fightercockpit_description = Progettato principalmente per velivoli non commerciali. Sulla scatola c'è scritto che andrebbe usato per addestrare i Kerbal. Questo spiega i due posti, uno per l'istruttore e l'altro per l'allievo.

		// Part : fightergear
		#loc_APP_part_fightergear_title = Carrello d'Atterraggio KS-51
		#loc_APP_part_fightergear_description = C'è molta scelta se ti serve un carrello d'atterraggio, ma è abbastanza assurdo che non esista un carrello che specchi la sospensione a destra e a sinistra rispettivamente. Certo, potrebbe essere per via della difficoltà di produrre le parti in modo esattamente simmetrico, ma questi sono dettagli. Non ci importano.

		// Part : fighterinlinecockpit
		#loc_APP_part_fighterinlinecockpit_title = Abitacolo Non Commerciale Mk1 In Linea
		#loc_APP_part_fighterinlinecockpit_description = Un abitacolo in linea progettato principalmente per velivoli non commerciali. Ha spazio per due Kerbal, ma con qualche compromesso. Ad esempio, è assente un qualsiasi portellone d'ingresso, rendendo possibile utilizzare solo il parabrezza rimovibile come punto d'accesso.

		// Part : fokkerprop
		#loc_APP_part_fokkerprop_title = Motore Rotativo 9J "Barone"
		#loc_APP_part_fokkerprop_description = Aspetta, TUTTO il motore gira?!

		// Part : fowlerflap
		#loc_APP_part_fowlerflap_title = Flap Scanalato
		#loc_APP_part_fowlerflap_description = Prendi un Elevone 2B e modificalo in modo da avere una maggiore libertà di movimento. Il meccanismo ostacola il movimento in due direzioni ma funziona, quindi è adatto per la vendita. Questo flap è solitamente posizionato nella parte posteriore dell'ala. Non è nulla di obbligatorio, sono solo le istruzioni sul manuale. Può essere utilizzato per controllare il beccheggio, durante il decollo oppure in fase di atterraggio se in completa estensione. E' utile anche per controllare con precisione la velocità di crociera.

		// Part : halfmini
		#loc_APP_part_halfmini_title = Fusoliera per Carburante Liquido MK0 Junior
		#loc_APP_part_halfmini_description = Niente soldi? Nessun problema!

		// Part : hanglel
		#loc_APP_part_hanglel_title = Connettore Alare Angolato A
		#loc_APP_part_hanglel_description = Non solleverà un aeroplano da solo, ma funziona perfettamente con tutti i prodotti Kerbal Standard (e non). Angolato di cinque gradi!

		// Part : hangles
		#loc_APP_part_hangles_title = Connettore Alare Angolato B
		#loc_APP_part_hangles_description = Non solleverà un aeroplano da solo, ma funziona perfettamente con tutti i prodotti Kerbal Standard (e non). Angolato di cinque gradi!

		// Part : hawkerprop
		#loc_APP_part_hawkerprop_title = Motore RR "Conte" K.XI
		#loc_APP_part_hawkerprop_description = Tutte le cose grandi hanno un'origine umile. Uno dei primi motori della serie RR, prima che diventassero effettivamente potenti.

		// Part : herculescockpit
		#loc_APP_part_herculescockpit_title = Abitacolo Non Commerciale di Taglia 2
		#loc_APP_part_herculescockpit_description = Ha spazio per 3 Kerbal grazie ai suoi interni più capienti. L'Abitacolo Non Commerciale è un lontano cugino dell'Abitacolo Commerciale ed è stato modificato in un tentativo di migliorarne la visibilità. E' inoltre più solido grazie a materiali più resistenti: ciò aggiunge del peso, ma non faremo certamente fat shaming, siamo nel moderno Secolo Kerbal.

		// Part : herculesfrontgear
		#loc_APP_part_herculesfrontgear_title = Carrello d'Atterraggio Basso KS-130
		#loc_APP_part_herculesfrontgear_description = Solo ruote da carico eccezionale e tubi di metallo prodotti a regola d'arte per una sospensione davvero solida. Le ruote sono ottime, visto il loro precedente impiego nei rover. Le modifiche per inserirle nel carrello sono state poche e irrisorie.

		// Part : herculesgear
		#loc_APP_part_herculesgear_title = Carrello d'Atterraggio Basso KS-130-S2
		#loc_APP_part_herculesgear_description = Solo ruote da carico eccezionale e tubi di metallo prodotti a regola d'arte per una sospensione davvero solida. Le ruote sono ottime, visto il loro precedente impiego nei rover. Le modifiche per inserirle nel carrello sono state poche e irrisorie.

		// Part : herculesprop
		#loc_APP_part_herculesprop_title = Motore Turboelica RR K56 "Titano"
		#loc_APP_part_herculesprop_description = Una GRANDE elica! Abbastanza potente per sollevare praticamente qualsiasi cosa, ma la velocità non è il suo forte.

		// Part : hipcockpit
		#loc_APP_part_hipcockpit_title = Abitacolo con Vista Taglia 2
		#loc_APP_part_hipcockpit_description = Il modo più lento per tirarsi dietro una fusoliera è usare un Abitacolo con Vista e guardare il panorama dalle sue grandi vetrate. Non ci sono altri abitacoli, delle stesse dimensioni o più piccoli, in grado di dare tutto questo spazio e visibilità.

		// Part : hipprop
		#loc_APP_part_hipprop_title = Turboalbero KV2-117A "Ippopotamo"
		#loc_APP_part_hipprop_description = Nell'industria Kerbal, "più potenza" significa solitamente "più grande". Per questo l'Ippopotamo è la prima scelta per le fusoliere di Taglia 2. I suoi grossi supporti metallici impediscono alle cinque pale di volare via in tutte le direzioni.

		// Part : hiptail
		#loc_APP_part_hiptail_title = Rotore di Controllo KV2-117A-S
		#loc_APP_part_hiptail_description = Tra la competizione per i rotori di controllo, il KV2-117A-S è senza rivali. Anche se ha solo 3 pale, queste sono comunque grandi e potenti. Le sue dimensioni maggiorate comportano un migliore controllo ed un maggiore peso. Ma le perdite al rapporto peso-potenza dovrebbero essere minime.

		// Part : hlfSrf
		#loc_APP_part_hlfSrf_title = Elevone 0
		#loc_APP_part_hlfSrf_description = Queste superfici di controllo sono realizzate con i materiali più pregiati e il loro funzionamento è garantito, a patto che restino attaccate all'apparecchio. Tuttavia, alcuni studi hanno mostrato che la mancanza di atmosfera *potrebbe* interferire leggermente con le loro prestazioni. Nessun rimborso.

		// Part : hueycockpit
		#loc_APP_part_hueycockpit_title = Abitacolo con Vista MK3S1.5
		#loc_APP_part_hueycockpit_description = I fortunati Kerbal che verranno assegnati ad un Abitacolo con Vista MK3S1.5 (che ha spazio per due) potranno godersi interni spaziosi e grandi vetri. Il suo design utilitario è comunque molto resistente: ha infatti resistito alla corrosione causata da tutti quegli anni in fondo al mare, dove è stato trovato.

		// Part : hueyprop
		#loc_APP_part_hueyprop_title = Motore Turboalbero L K53 "Valchiria"
		#loc_APP_part_hueyprop_description = Il Turboalbero "Valchiria" è una delle parti recuperate dall'oceano dell'est. Molte parti sono state trovate sui fondali marini, in realtà. La particolarità di questo motore è il contrappeso stabilizzatore, che assieme alle due pale produce un suono caratteristico.

		// Part : hueytail
		#loc_APP_part_hueytail_title = Rotore di Controllo L K53-S
		#loc_APP_part_hueytail_description = Anche questo rotore, come il Turboalbero "Valchiria", è stato trovato in fondo al mare: è forse per questo motivo che le due parti vengono solitamente utilizzate assieme. Il rotore serve a stabilizzare l'imbardata del veicolo ed a consentire il movimento sullo stesso asse.

		// Part : kruegerflap
		#loc_APP_part_kruegerflap_title = Flap Krueger Ventrale
		#loc_APP_part_kruegerflap_description = Per far passare un messaggio talvolta vanno prese misure estreme. Questo è il pensiero dietro a questo flap. Il complesso meccanismo che lo fa funzionare è esposto in tutta la sua gloria quando viene esteso. Questo flap è solitamente posizionato nella parte anteriore-ventrale dell'ala. Non è nulla di obbligatorio, sono solo le istruzioni sul manuale. Può essere utilizzato per controllare il beccheggio, durante il decollo oppure in fase di atterraggio se in completa estensione. E' utile anche per controllare con precisione la velocità di crociera.

		// Part : landingskid
		#loc_APP_part_landingskid_title = Pattini d'Atterraggio Anti-Rollio
		#loc_APP_part_landingskid_description = Stanco di rotolare via quando atterri con una fusoliera cilindrica? Non dire altro! Vi presentiamo i Pattini d'Atterraggio Anti-Rollio! Basterà attaccarli sulla parte inferiore della fusoliera e ogni problema di rotolamento sarà risolto.

		// Part : merlin
		#loc_APP_part_merlin_title = Motore RR "Marlin"
		#loc_APP_part_merlin_description = Tanto i motori jet sono troppo mainstream. Questo motore è per chi vuole qualcosa di meglio del "Mulinello". (Kilroy was here)

		// Part : migfin
		#loc_APP_part_migfin_title = Aletta Delta-Avanzata
		#loc_APP_part_migfin_description = L'Aletta Delta-Avanzata porta un miglioramento aerodinamico sostanziale rispetto all'Aletta Delta-Deluxe. Se ti serve un'aletta dalle dimensioni importanti, o se devi semplicemente vantarti delle tue capacità di controllo aerodinamico, la Delta-Avanzata fa al caso tuo.

		// Part : miggear
		#loc_APP_part_miggear_title = Carrello d'Atterraggio Alto KS-29
		#loc_APP_part_miggear_description = Il KS-29 è stato pensato come carrello per le piste sterrate. Tuttavia, quando il progetto è stato approvato la pista del Centro Spaziale era già stata pavimentata. Stiamo dicendo questo per toglierci qualsasi responsabilità in caso di collasso su terreni sconnessi (cosa che non dovrebbe assolutamente succedere).

		// Part : miniboom
		#loc_APP_part_miniboom_title = Connettore di Coda Mk0
		#loc_APP_part_miniboom_description = Tipo un cono gelato molto lungo!

		// Part : minishortboom
		#loc_APP_part_minishortboom_title = Connettore di Coda Mk0 Corto
                #loc_APP_part_minishortboom_description = Tipo un cono gelato!

		// Part : mk1DroneCore
		#loc_APP_part_mk1DroneCore_title = Nucleo per Droni MK1
		#loc_APP_part_mk1DroneCore_description = Completamente autonomo. Non necessita di neanche un Kerbal per funzionare.

		// Part : mk1SasModule
		#loc_APP_part_mk1SasModule_title = Stabilizzatore in Linea Mk1
		#loc_APP_part_mk1SasModule_description = Togliere il Nucleo per Droni ha reso facile riconfigurare la coppia, con tutto lo spazio che si è liberato. E' ora più leggero e i miglioramenti nella coppia l'hanno reso decisamente più stabile e potente.

		// Part : mk1cargodoor
		#loc_APP_part_mk1cargodoor_title = Portello per Cargo Mk1 CRG-50-1
		#loc_APP_part_mk1cargodoor_description = Sicuramente un modo elegante per portarsi dietro le cose più svariate. Ottenuto ritagliando solo le migliori Fusoliere Strutturali Mk1.

		// Part : mk1cargodoorjr
		#loc_APP_part_mk1cargodoorjr_title = Portello per Cargo Mk1 Junior CRG-50-0
		#loc_APP_part_mk1cargodoorjr_description = Sicuramente un modo elegante per portarsi dietro le cose più svariate. Ottenuto ritagliando solo le migliori Fusoliere Strutturali Mk1.

		// Part : mk1dronedoor
		#loc_APP_part_mk1dronedoor_title = Stiva da Muso Mk1 CRG-NT
		#loc_APP_part_mk1dronedoor_description = Ti serve spazio extra per il tuo velivolo a controllo remoto? Devi trasportare qualcosa che va posizionato al posto dell'abitacolo? O necessiti semplicemente di una protezione aerodinamica per le tue avioniche? Kerbal Standard ha la soluzione, un vero e proprio bagagliaio sotto il muso. Tanto spazio per tutte le tue esigenze!

		// Part : mk1intake
		#loc_APP_part_mk1intake_title = Presa d'Aria Mk1
		#loc_APP_part_mk1intake_description = Una presa d'aria per la taglia Mk1. Ha due varianti estetiche, sta al cliente la scelta.

		// Part : mk2hAdapter
		#loc_APP_part_mk2hAdapter_title = Adattatore da Mk2/H a 1.25m
		#loc_APP_part_mk2hAdapter_description = Un generico adattatore da Mk2/H a 1.25m. Per tutti gli usi.

		// Part : mk2hLiquid
		#loc_APP_part_mk2hLiquid_title = Fusoliera per Carburante Liquido Mk2h
		#loc_APP_part_mk2hLiquid_description = Per andare più veloce abbiamo calcolato che la metà inferiore delle fusoliere non è così necessaria. Contiene solo Carburante Liquido.

		// Part : mk2hboom
		#loc_APP_part_mk2hboom_title = Asta di Coda Piatta Mk2/H
		#loc_APP_part_mk2hboom_description = Si attacca in fondo alle parti Mk2/h (in teoria).

		// Part : mk2mk2h
		#loc_APP_part_mk2mk2h_title = Adattatore da Mk2/H a Mk2
		#loc_APP_part_mk2mk2h_description = Se decidi di tornare al classico fattore forma Mk2, questo adattatore trasforma la metà in intero.

		// Part : mk3galaxy
		#loc_APP_part_mk3galaxy_title = Abitacolo Cargo Mk3
		#loc_APP_part_mk3galaxy_description = La migliore, nonché unica, soluzione se ti serve infilare del carico piazzando un portellone dove solitamente si trova l'abitacolo.

		// Part : mk3s0
		#loc_APP_part_mk3s0_title = Fusoliera per Carburante Liquido Mk3S0 
		#loc_APP_part_mk3s0_description = E' difficile trovare utilizzi appropriati per un serbatoio più piccolo (anche se solo leggermente) della Taglia 0. Tuttavia esso esiste, un serbatoio S0 con i lati tagliati.

		// Part : mk3s0-s0
		#loc_APP_part_mk3s0-s0_title = Adattatore da Mk3S0 a 0.625m
		#loc_APP_part_mk3s0-s0_description = Adatta la sezione Mk3S0 ad una 0.625m circolare.

		// Part : mk3s0booma
		#loc_APP_part_mk3s0booma_title = Connettore di Coda A Mk3S0
		#loc_APP_part_mk3s0booma_description = Una parte aerodinamica per sezioni di coda dal design unico, ora anche nel formato Mk3S0.

		// Part : mk3s0boomb
		#loc_APP_part_mk3s0boomb_title = Connettore di Coda B Mk3S0
		#loc_APP_part_mk3s0boomb_description = Una parte aerodinamica per sezioni di coda dalla forma peculiare, ora anche nel formato Mk3S0.

		// Part : mk3s0jr
		#loc_APP_part_mk3s0jr_title = Fusoliera per Carburante Liquido Mk3S0 Junior
		#loc_APP_part_mk3s0jr_description = Uno dei serbatoi di carburante più piccoli disponibili ai Kerbal.

		// Part : mk3s0nose
		#loc_APP_part_mk3s0nose_title = Muso Ogivale Mk3S0
		#loc_APP_part_mk3s0nose_description = Un Muso Ogivale in taglia Mk3S0. Interessante!

		// Part : mk3s1
		#loc_APP_part_mk3s1_title = Fusoliera per Carburante Liquido Mk3S1
		#loc_APP_part_mk3s1_description = La taglia Mk1 da 1.25m è troppo mainstream. Per portare un po' di varietà è nata la serie Mk3S1, ora con il 50% di tondezza in meno!

		// Part : mk3s1-s1
		#loc_APP_part_mk3s1-s1_title = Adattatore da Mk3S1 a 1.25m
		#loc_APP_part_mk3s1-s1_description = Adatta la classe Mk3S1 nella classe circolare 1.25m.

		// Part : mk3s1booma
		#loc_APP_part_mk3s1booma_title = Connettore di Coda Mk3S1 A
		#loc_APP_part_mk3s1booma_description = Una versione modificata dell'originale Connettore di Coda Mk1, meno arrotondato ma ugualmente aerodinamico.

		// Part : mk3s1boomb
		#loc_APP_part_mk3s1boomb_title = Connettore di Coda Mk3S1 B
		#loc_APP_part_mk3s1boomb_description = Una versione modificata dell'originale Connettore di Coda Mk1, meno arrotondato ma ugualmente aerodinamico.

		// Part : mk3s1intake
		#loc_APP_part_mk3s1intake_title = Presa d'Aria a Rampa Mk3S1 
		#loc_APP_part_mk3s1intake_description = Una Presa d'Aria a Rampa Configurabile Mk1 messa a dieta. Un pochino più leggera, ma soprattutto si può infilare in spazi impensabili per la Mk1.

		// Part : mk3s1jr
		#loc_APP_part_mk3s1jr_title = Fusoliera per Carburante Liquido Mk3S1 Junior
		#loc_APP_part_mk3s1jr_description = Semplicemente la versione Senior tagliata a metà, assolutamente non con un paio di forbici con la punta arrotondata.

		// Part : mk3s1nose
		#loc_APP_part_mk3s1nose_title = Muso Ogivale Mk3S1
		#loc_APP_part_mk3s1nose_description = Una versione modificata dell'originale Muso Ogivale Mk1, meno arrotondato ma ugualmente conico e aerodinamico.

		// Part : mk3s1p5
		#loc_APP_part_mk3s1p5_title = Fusoliera per Carburante Liquido Mk3S1.5
		#loc_APP_part_mk3s1p5_description = La serie Mk3S1.5 è relativamente moderna. Ovviamente questi serbatoi sono nuovi di zecca, ma molte parti di questo diametro potrebbero o non potrebbero essere state recuperate dal fondale oceanico.

		// Part : mk3s1p5-mk3s1
		#loc_APP_part_mk3s1p5-mk3s1_title = Fusoliera per Carburante Liquido Mk3S1.5-Mk3S1
		#loc_APP_part_mk3s1p5-mk3s1_description = Da un diametro Mk3 all'altro. Ha anche spazio per un pochetto di carburante. Il nome della parte è spesso utilizzato come scioglilingua.

		// Part : mk3s1p5-s1p5
		#loc_APP_part_mk3s1p5-s1p5_title = Adattatore da Mk3S1.5 a 1.875m
		#loc_APP_part_mk3s1p5-s1p5_description = Adatta la taglia Mk3S1.5 alla circolare 1.875m. Essenziale per... qualche utilizzo non specificato.

		// Part : mk3s1p5doorbase
		#loc_APP_part_mk3s1p5doorbase_title = Portello per Cargo Mk3S1.5
		#loc_APP_part_mk3s1p5doorbase_description = Si apre e si chiude che è una meraviglia, ha anche un'opzione con i finestrini. Potrebbe non consentire l'EVA se è posizionata tra due parti, ma i Kerbal possono sempre entrare nel veicolo tramite essa.

		// Part : mk3s1p5hull
		#loc_APP_part_mk3s1p5hull_title = Fusoliera Strutturale Mk3S1.5
		#loc_APP_part_mk3s1p5hull_description = Alcune Fusoliere Mk3S1.5 sono state trovate in magazzino con il serbatoio interno arrugginito. La soluzione migliore è stata chiaramente rimuoverlo e aggiungere "strutturale" all'adesivo con il nome dei pezzi.

		// Part : mk3s1p5jr
		#loc_APP_part_mk3s1p5jr_title = Fusoliera per Carburante Liquido Mk3S1.5 Junior
		#loc_APP_part_mk3s1p5jr_description = Alcune Fusoliere per Carburante Liquido Mk3S1.5 trovate sul fondale dell'oceano sono così malridotte che vanno tagliate a metà per diventare presentabili.

		// Part : navlight
		#loc_APP_part_navlight_title = Faro di Navigazione
		#loc_APP_part_navlight_description = Il Faro di Navigazione è solitamente utilizzato per far vedere che c'è qualcosa nel buio. Ottimo anche come luminaria natalizia.

		// Part : noseconemk1
		#loc_APP_part_noseconemk1_title = Muso Ogivale Mk1
		#loc_APP_part_noseconemk1_description = Un componente aerodinamico molto di moda tra i giovani ingegneri aeronautici.

		// Part : oh6cockpit
		#loc_APP_part_oh6cockpit_title = Abitacolo con Vista Mk1 Tipo II
		#loc_APP_part_oh6cockpit_description = Una versione evoluta del classico Abitacolo con Vista Mk1. Il team di ricerca e sviluppo ha lavorato sodo per posizionare un singolo faretto sulla parte anteriore. Il suo nuovo aspetto tondeggiante dovrebbe intimorire l'aria facendola scappare via.

		// Part : oldfightercockpit
		#loc_APP_part_oldfightercockpit_title = Abitacolo in Linea Rinforzato MK1
		#loc_APP_part_oldfightercockpit_description = Una versione relativamente moderna dell'abitacolo MK1/0. Il nome MK1/1 sembrava "banale" al reparto marketing.

		// Part : passengeroor
		#loc_APP_part_passengeroor_title = Portellone per Passeggeri Mk1
		#loc_APP_part_passengeroor_description = Costruito per i Kerbal desiderosi di uscire dalle fusoliere in linea MK1.

		// Part : powerprop
		#loc_APP_part_powerprop_title = Motore Turboalbero K73 "Beluga" 
		#loc_APP_part_powerprop_description = Sei pale enormi per sollevare qualsiasi carico ragionevole (e anche qualche carico completamente irragionevole).

		// Part : powertail
		#loc_APP_part_powertail_title = Rotore di Controllo K73-S
		#loc_APP_part_powertail_description = Un rotore così grande potrebbe sollevare da solo un elicottero, sembra quasi di starne sprecando il potenziale mettendolo su una coda.

		// Part : predatorprop
		#loc_APP_part_predatorprop_title = Motore Turboelica K76 "Predatore" 
		#loc_APP_part_predatorprop_description = Una turboelica potentissima. Da mostrare agli amici per fare vedere che il numero di pale è davvero solo un numero.

		// Part : raptorjet
		#loc_APP_part_raptorjet_title = Turboventola Postbruciante J-119 "Ghepardo" 
		#loc_APP_part_raptorjet_description = Un innovativo sistema idraulico consente una deflezione del getto senza precedenti. Ovviamente c'è un compromesso: l'asse di deflezione è ora singolo. Ottimo in coppia con un altro "Ghepardo"!

		// Part : roundwinglet
		#loc_APP_part_roundwinglet_title = Aletta Tondo-Deluxe
		#loc_APP_part_roundwinglet_description = L'Aletta Tondo-Deluxe è davvero una soluzione a tutto tondo ad ogni tuo problema aerodinamico. 

		// Part : s1p5
		#loc_APP_part_s1p5_title = Fusoliera per Carburante Liquido 1.875m 
		#loc_APP_part_s1p5_description = Ogni tanto, qualche fusoliera da 1.875m si schianta a terra dopo un lancio dal Centro Spaziale. Quelle messe meglio vengono recuperate di soppiatto; la matricola viene quindi cancellata e, sostituendo il doppio serbatoio interno con uno singolo di carburante liquido, la Fusoliera per Carburante Liquido 1.875m è pronta alla vendita.

		// Part : s1p5CrewCabin
		#loc_APP_part_s1p5CrewCabin_title = Cabina per Equipaggio Taglia 1.5
		#loc_APP_part_s1p5CrewCabin_description = Se le cabine da 2.5m costano troppo, ecco una soluzione a metà prezzo. Spedita sotto forma di pratico kit a causa delle tasse sulle fusoliere preassemblate.

		// Part : s1p5booma
		#loc_APP_part_s1p5booma_title = Connettore di Coda A Taglia 1.5 
		#loc_APP_part_s1p5booma_description = Modello standard nella serie "Sezioni di coda aerodinamiche per velivoli, formato 1.5".

		// Part : s1p5boomashort
		#loc_APP_part_s1p5boomashort_title = Connettore di Coda A Taglia 1.5 Accorciato
		#loc_APP_part_s1p5boomashort_description = Nonostante il nome, questo pezzo non è stato (incredibilmente) ritagliato dalla controparte standard.

		// Part : s1p5boomb
		#loc_APP_part_s1p5boomb_title = Connettore di Coda B di Taglia 1.5 
		#loc_APP_part_s1p5boomb_description = Modello alternativo nella serie "Sezioni di coda aerodinamiche per velivoli, formato 1.5".

		// Part : s1p5boombshort
		#loc_APP_part_s1p5boombshort_title = Connettore di Coda B Taglia 1.5 Accorciato
		#loc_APP_part_s1p5boombshort_description = Nonostante il nome, questo pezzo non è stato (incredibilmente) ritagliato dalla controparte standard.

		// Part : s1p5door
		#loc_APP_part_s1p5door_title = Rampa Aerea Taglia 1.5 
		#loc_APP_part_s1p5door_description = Pezzo per la Taglia 1.5 utile per entrare o uscire dalla fusoliera.

		// Part : s1p5hull
		#loc_APP_part_s1p5hull_title = Fusoliera Strutturale Taglia 1.5 Junior
		#loc_APP_part_s1p5hull_description = Costruita con materiali economici ma comunque resistenti e anche abbastanza leggeri. La versione Junior è stata ideata per soddisfare grandi e piccini.

		// Part : s1p5hulllong
		#loc_APP_part_s1p5hulllong_title = Fusoliera Strutturale Taglia 1.5
		#loc_APP_part_s1p5hulllong_description = Costruita con materiali economici ma comunque resistenti e anche abbastanza leggeri.

		// Part : s1p5jr
		#loc_APP_part_s1p5jr_title = Fusoliera per Carburante Liquido 1.875m Junior
		#loc_APP_part_s1p5jr_description = Grande la metà della versione standard, la versione Junior della Fusoliera per Carburante Liquido 1.875m è più economica perchè costruita con rottami altrimenti inutilizzabili.

		// Part : s2CargoRamp
		#loc_APP_part_s2CargoRamp_title = Rampa Cargo di Taglia 2
		#loc_APP_part_s2CargoRamp_description = Un sistema di attuatori idraulici consente l'apertura di questa rampa sulla terra, nel cielo, in mare, nello spazio... praticamente ovunque!

		// Part : s2cargobayS
		#loc_APP_part_s2cargobayS_title = Stiva Cargo di Taglia 2 CRG-15
		#loc_APP_part_s2cargobayS_description = Ritagliando due portelloni ed attaccandoli con delle cerniere è stata ricavata una stiva apribile dal sopra che facilita l'accesso al carico interno.

		// Part : shortboom
		#loc_APP_part_shortboom_title = Connettore di Coda Corto B
		#loc_APP_part_shortboom_description = E' tipo un grosso cono gelato (ma storto)!

		// Part : shortboomb
		#loc_APP_part_shortboomb_title = Connettore di Coda Corto A
		#loc_APP_part_shortboomb_description = Tipo un cono gelato!

		// Part : sidegear
		#loc_APP_part_sidegear_title = Carrello d'Atterraggio Diagonale KS-16 
		#loc_APP_part_sidegear_description = Qualche volta diventa necessario estendere il carrello d'atterraggio di un velivolo diagonalmente, ma così facendo le ruote si dispiegano storte. Il KS-16 è stato pensato per queste situazioni. Sicuramente le sospensioni riciclate dai vecchi modelli funzioneranno alla grande montate su delle lunghe aste diagonali.

		// Part : size2CrewCabin
		#loc_APP_part_size2CrewCabin_title = Cabina per Equipaggio Taglia 2
		#loc_APP_part_size2CrewCabin_description = Questa cabina è stata pensata per chi crede che l'abitacolo "Autostoppista" sia troppo piccolo. Tiene 16 Kerbal senza nessun fronzolo a un prezzo stracciato.

		// Part : size2Fuselage
		#loc_APP_part_size2Fuselage_title = Fusoliera per Carburante Liquido Taglia 2
		#loc_APP_part_size2Fuselage_description = Perchè tenere il serbatoio per l'ossidante vuoto, quando lo si può riempire di carburante?

		// Part : size2taila
		#loc_APP_part_size2taila_title = Connettore di Coda Taglia 2A
		#loc_APP_part_size2taila_description = Una semplice coda aerodinamica per aerei. Progettata per calzare a pennello tutte le fusoliere da 1.25, è uno dei nostri pezzi più venduti.

		// Part : size2tailashort
		#loc_APP_part_size2tailashort_title = Connettore di Coda Taglia 2A Accorciato
		#loc_APP_part_size2tailashort_description = Versione accorciata del Connettore di Coda Taglia 2A; utile se serve qualcosa di più corto o se si è a corto di fondi.

		// Part : size2tailb
		#loc_APP_part_size2tailb_title = Connettore di Coda Taglia 2B
		#loc_APP_part_size2tailb_description = Una semplice coda aerodinamica per aerei. Progettata per calzare a pennello tutte le fusoliere da 1.25, è uno dei nostri pezzi più venduti.

		// Part : size2tailbshort
		#loc_APP_part_size2tailbshort_title = Connettore di Coda Taglia 2B Accorciato
		#loc_APP_part_size2tailbshort_description = Versione accorciata del Connettore di Coda Taglia 2B; utile se serve qualcosa di più corto o se si è a corto di fondi.

		// Part : size2under
		#loc_APP_part_size2under_title = Montaggio Radiale per Serbatoi di Carburante Liquido Taglia 2
		#loc_APP_part_size2under_description = Adatto ai serbatoi di taglia 2, viene solitamente utilizzato per agganciarci serbatoi di carburante.

