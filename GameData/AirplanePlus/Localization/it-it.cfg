		// Part : smallwingConnectortip
		#loc_APP_part_smallwingConnectortip_title = Connettore Alare con Punta
		#loc_APP_part_smallwingConnectortip_description = NON è pane per tramezzini! 

		// Part : spadprop
		#loc_APP_part_spadprop_title = Motore 8A "Sputacchio"
		#loc_APP_part_spadprop_description = Un motore a V abbastanza "potente" (con svariate virgolette), adatto a piccoli e medi velivoli.

		// Part : spitfiremerlin
		#loc_APP_part_spitfiremerlin_title = Motore RR "Kraken" 
		#loc_APP_part_spitfiremerlin_description = Straordinariamente potente, ancor più del "Marlin", tanto da dover prendere in prestito il nome dalla mitologica creatura.

		// Part : spoilerflap
		#loc_APP_part_spoilerflap_title = S.P.O.I.L.E.R
		#loc_APP_part_spoilerflap_description = Il Supporto Pivotale Ortogonale Ideato per Liquidare Eccessiva Reggenza (S.P.O.I.L.E.R) fa esattamente ciò che dice l'acronimo. Utile quando si ha troppa portanza e serve qualcosa per ridurla. Questo è uno dei sistemi più semplici per perdere questa spinta in eccesso. A differenza dei F.R.E.N.A. gli S.P.O.I.L.E.R. non aggiungono solamente resistenza aerodinamica e portano ad una riduzione della portanza maggiore. Provare per credere.

		// Part : straightslat
		#loc_APP_part_straightslat_title = Slat dritto per bordo d'attacco
		#loc_APP_part_straightslat_description = Un tipico slat che si estende verso il basso. Questo slat è solitamente posizionato nella parte anteriore dell'ala. Non è nulla di obbligatorio, sono solo le istruzioni sul manuale. Può essere utilizzato per controllare il beccheggio, durante il decollo oppure in fase di atterraggio se in completa estensione. E' utile anche per controllare con precisione la velocità di crociera.

		// Part : stubbytinynose
		#loc_APP_part_stubbytinynose_title = Piccolo Muso Ogivale Schiacciato
		#loc_APP_part_stubbytinynose_description = Un Muso Ogivale piccolo e schiacciato, assolutamente non ricavato da musi finiti nella pressa idraulica e salvati per un pelo.

		// Part : tbmProp
		#loc_APP_part_tbmProp_title = Motore Turboelica KT6A "Micio"
		#loc_APP_part_tbmProp_description = Per essere così piccolo si porta dietro un bel po' di spinta! 

		// Part : tinynoseb
		#loc_APP_part_tinynoseb_title = Piccolo Muso Ogivale Diagonale B
		#loc_APP_part_tinynoseb_description = Un Muso Ogivale angolato.

		// Part : vanglel
		#loc_APP_part_vanglel_title = Connettore Alare Angolato C
		#loc_APP_part_vanglel_description = Di certo non solleverà da terra un aereo, ma questa fettina di ala consente la creazione di forme mai viste. Ha un angolo di cinque gradi.

		// Part : vangles
		#loc_APP_part_vangles_title = Connettore Alare Angolato D
		#loc_APP_part_vangles_description = Di certo non solleverà da terra un aereo, ma questa fettina di ala consente la creazione di forme mai viste. Ha un angolo di cinque gradi.

		// Part : warhawkfin
		#loc_APP_part_warhawkfin_title = Aletta Curva Base
		#loc_APP_part_warhawkfin_description = L'Aletta Curva Base è l'utilitaria delle alette aerodinamiche. La sua ambiguità tra superficie di coda o canard è parte del suo fascino.

		// Part : x1cockpit
		#loc_APP_part_x1cockpit_title = Abitacolo Supersonico Mk1
		#loc_APP_part_x1cockpit_description = Un abitacolo progettato inizialmente con un solo obiettivo: infrangere il muro del suono. Il peso è stato ridotto al minimo indispensabile, quindi ci sta (stretto) solo un Kerbal; tuttavia il parabrezza a grata fornisce un'ottima visibilità esterna.

		// Part : x1gear
		#loc_APP_part_x1gear_title = Carrello d'Atterraggio Sterzabile KS-X1
		#loc_APP_part_x1gear_description = Un carrello d'atterraggio così piccolo che quasi ti dimenticherai di averlo posizionato. Non dimenticartene davvero!

		// Part : x1sidegear
		#loc_APP_part_x1sidegear_title = Carrello d'Atterraggio Asimmetrico KS-X1
		#loc_APP_part_x1sidegear_description = Il carrello si nasconde perfettamente in linea con una fusoliera Mk1 nascondendo la ruota dalla vista.

		// Part : yakprop
		#loc_APP_part_yakprop_title = Motore KM-105P "Corvo d'Argento"
		#loc_APP_part_yakprop_description = La finitura metallica renderà il tuo velivolo sicuramente più veloce, almeno così ci dicono dal team del marketing.

		// Part : zerocockpit
		#loc_APP_part_zerocockpit_title = Abitacolo in Linea a Gabbia MK1/0
		#loc_APP_part_zerocockpit_description = Se ti intimorisce il pensiero di essere separato dall'atmosfera esterna solo da un sottile strato di vetro, questo abitacolo fa al caso tuo. Ora a separare te e il cielo è solo un sottile strato di piccoli finestrini intelaiati in una gabbia metallica: rassicurante!

		// Part : zeroprop
		#loc_APP_part_zeroprop_title = Motore Radiale K-14 "Vento Divino"
		#loc_APP_part_zeroprop_description = Questo ottimo motore ha ben due file di pistoni radiali! Altro che "più potenza"! Garanzia nulla se si raggiunge effettivamente "più potenza".
	}
