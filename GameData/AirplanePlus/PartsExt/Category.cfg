@CUSTOM_PARTLIST_CATEGORY[#HAS[categoryName[Airplane+]]]
{
	@SUBCATEGORY[Command]
	{
		@PARTS
		{
			// ColdJ
			part = CesCockCJ
		}
	}

	@SUBCATEGORY[Payload]
	{
		@PARTS
		{
			// ColdJ
			part = mk3s1doorbaseCJ
		}
	}

	@SUBCATEGORY[Structure?and?Fuel]
	{
		@PARTS
		{
			// ColdJ
			part = mk3s05capCJ
			part = mk3s0s05adapterCJ
			part = mk3s1s0adapterCJ
			part = mk3s1s0ShtAdaptrCJ
		}
	}

	@SUBCATEGORY[Utility]
	{
		@PARTS
		{
			// ColdJ
			part = cessnacabinCJ
		}
	}
}
