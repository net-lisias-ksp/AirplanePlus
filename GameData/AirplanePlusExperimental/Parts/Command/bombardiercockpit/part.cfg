@PART[bombardiercockpit]
{
    @MODEL
    {
        @model = AirplanePlusExperimental/Parts/Command/bombardiercockpit/model
    }

    MODULE
    {
        name = ModulePartVariants
        baseVariant = Nosecone
        useMultipleDragCubes = true
        VARIANT
        {
            name = Nosecone
            displayName = Nosecone
            primaryColor = #ffffff
            secondaryColor = #ffffff
            GAMEOBJECTS
            {
                cockpit = true
                collider.collider = true
                cockpitNose = true
                cockpitNose.collider = true
                cockpitNode = false
            }
        }
        VARIANT
        {
            name = Snub
            displayName = Snub
            primaryColor = #ffffff
            secondaryColor = #333333
            GAMEOBJECTS
            {
                cockpit = true
                collider.collider = true
                cockpitNose = false
                cockpitNose.collider = false
                cockpitNode = true
            }
        }
    }
}