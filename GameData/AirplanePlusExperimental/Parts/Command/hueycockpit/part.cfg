@PART[hueycockpit]
{
    @MODEL
    {
        @model = AirplanePlusExperimental/Parts/Command/hueycockpit/HueyLewisAndTheNews
    }

    MODULE
    {
        name = ModulePartVariants
        baseVariant = Round
        useMultipleDragCubes = false
        VARIANT
        {
            name = Round
            displayName = Size 1.5
            primaryColor = #ffffff
            secondaryColor = #ffffff
            GAMEOBJECTS
            {
                cockpitevaFlat = false
                cockpitevaRound = true
                cockpitevaCollider = true
                cockpitevaFlatCollider = false
            }
        }
        VARIANT
        {
            name = Cringe
            displayName = Size 1.5 Flatsided
            primaryColor = #ffffff
            secondaryColor = #ffffff
            GAMEOBJECTS
            {
                cockpitevaFlat = true
                cockpitevaRound = false
                cockpitevaCollider = false
                cockpitevaFlatCollider = true
            }
        }
    }
}