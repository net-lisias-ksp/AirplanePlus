@PART[tbmProp]:NEEDS[Waterfall&AirplanePlus]:FOR[APPWaterfallEffects]
{
	MODEL
	{
		model = AirplanePlus/Parts/Engine/Modern/tbmprop/model
	}
	MODEL
	{
		model = APPWaterfallEffects/AirplanePlus/tbm_plumes
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = tbmProp-waterfall
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			responseRateUp = 0.02
			responseRateDown = 0.02
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = stock-kerozine-turbofan-1
			overrideParentTransform = Plume
			position = 0,0,0
			rotation = 0,0,0
			scale = 0.12, 0.12, 0.2
		}
	}

	@MODULE[FSmeshSwitch],0
	{
		%objectDisplayNames = Kitty;Avantitty
		%objects = body1, nosecone1, nblade1, nblade2, nblade3, nblade4, nblade5, collider1, Puller;body2, nosecone2, rblade1, rblade2, rblade3, rblade4, rblade5, collider2, Pusher
	}
}




