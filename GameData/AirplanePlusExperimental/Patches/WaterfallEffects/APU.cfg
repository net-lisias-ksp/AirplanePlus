@PART[S1APU]:NEEDS[Waterfall&AirplanePlus]:FOR[APPWaterfallEffects]
{
	MODEL
	{
		model = APPWaterfallEffects/AirplanePlus/apu_plumes
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = S1APU-waterfall
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			responseRateUp = 0.02
			responseRateDown = 0.02
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = stock-kerozine-turbofan-1
			overrideParentTransform = Plume1
			position = 0,0,0
			rotation = 90,0,0
			scale = 0.2, 0.2, 0.1
		}
	}
}

