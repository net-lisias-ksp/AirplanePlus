@PART[f5jet]:NEEDS[Waterfall&AirplanePlus]:FOR[APPWaterfallEffects]
{
	!EFFECTS {}

	EFFECTS
	{		

		running_dry
		{
			AUDIO
			{
				channel = Ship
				clip = AirplanePlus/Sounds/fighter_low
				volume = 0.0 0.0
				volume = 0.4 0.0
				volume = 0.5 0.1
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 0.25 0.6
				pitch = 0.5 0.75
				pitch = 1.0 0.85
				loop = true
			}
		}

		power_dry
		{
			AUDIO
			{
				channel = Ship
				clip = AirplanePlus/Sounds/fighter_idle
				volume = 0.0 0.0
				volume = 0.05 0.7
				volume = 0.5 0.9
				volume = 0.75 0.75
				volume = 1.0 0.25
				pitch = 0.0 0.4
				pitch = 0.05 0.5
				pitch = 1.0 0.9
				loop = true
			}
		}running_wet
		{
			AUDIO
			{
				channel = Ship
				clip = AirplanePlus/Sounds/fighter_low
				volume = 0.0 0.0
				volume = 0.05 0.9
				volume = 1.0 1.0
				pitch = 0.0 0.5
				pitch = 0.05 0.6
				pitch = 0.33 1.0
				pitch = 1.0 1.2
				loop = true
			}
		}
		power_wet
		{

			AUDIO
			{
				channel = Ship
				clip = AirplanePlus/Sounds/afterburn_big
				volume = 0.0 0.0
				volume = 0.1 0.3
				volume = 1.0 0.4
				pitch = 0.0 0.5
				pitch = 0.33 0.8
				pitch = 1.0 1.0
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_medium
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		wet
		{
			AUDIO
			{
				channel = Ship
				clip = AirplanePlus/Sounds/afterburn_start
				volume = 1.0
				pitch = 1.0
				loop = false
			}
		}
		dry
		{
			AUDIO
			{
				channel = Ship
				clip = AirplanePlus/Sounds/afterburn_stop
				volume = 0.9
				pitch = 1.0
				loop = false
			}
		}
		flameout
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}

	@MODULE[ModuleEngines*],0
	{
		%flameoutEffectName = flameout
		%powerEffectName = power_dry
		%spoolEffectName = running_dry
		%engageEffectName = engage
		%disengageEffectName = disengage
	}
	@MODULE[ModuleEngines*],1
	{
		%flameoutEffectName = flameout
		%runningEffectName = power_wet
		%spoolEffectName = running_wet
		%engageEffectName = wet
		%disengageEffectName = dry
	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = f5jet-dry
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = Dry
			responseRateUp = 0.01
			responseRateDown = 0.01
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = stock-kerozine-turbofan-2
			overrideParentTransform = thrustTransform
			position = 0,0,0.44
			rotation = 0, 0, 0
			scale = 0.6, 0.6, 0.4
		}

	}

	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = f5jet-wet
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = Wet
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = app-kerozine-afterburner-static
			overrideParentTransform = thrustTransform
			position = 0,0,0.61
			rotation = 0,0,0
			scale = 0.61, 0.61, 0.4
		}

	}

}




